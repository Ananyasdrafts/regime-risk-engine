[project]
name = "regimerisk"
version = "0.0.1"
description = "Synthetic markets with known regime shifts, used to test when conformal VaR/ES goes miscalibrated and whether abstention catches it before a regulatory backtest does."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ananya Gupta" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
